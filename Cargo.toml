[workspace]
resolver = "2"
members = [
    "compiler/forja-errors",
    "compiler/forja-span",
    "compiler/forja-session",
    "compiler/forja-hir",
    "compiler/forja-ir",
    "compiler/forja-bytecode",
    "compiler/forja-driver",
    "compiler/forja-runtime",
    "compiler/forja-vm",
    "compiler/forja-native",
    "compiler/forja-registry",
    "compiler/forja-syntax",
    "compiler/forja-types",
    "compiler/forja-fmt",
    "compiler/forja-lint",
    "library/gui-theme",
    "library/gui-core",
    "library/gui-rt",
    "library/wasm",
    "library/wasm-gui",
    "library/gui-dom",
    "library/rt",
    "library/android",
    "src/bootstrap",
    "src/tools/forja-cli",
    "src/tools/forja-lsp",
    "src/tools/forja-dap",
]

# Build/test por defecto: compilador + CLI. GUI/Android/WASM se piden explícitos.
default-members = [
    "compiler/forja",
    "compiler/forja-errors",
    "compiler/forja-span",
    "compiler/forja-session",
    "compiler/forja-hir",
    "compiler/forja-ir",
    "compiler/forja-bytecode",
    "compiler/forja-driver",
    "compiler/forja-runtime",
    "compiler/forja-vm",
    "compiler/forja-native",
    "compiler/forja-registry",
    "compiler/forja-syntax",
    "compiler/forja-types",
    "compiler/forja-fmt",
    "compiler/forja-lint",
    "src/bootstrap",
    "src/tools/forja-cli",
    "src/tools/forja-repl",
]
exclude = [".forja_gui_cache", "fuzz"]

# xilem y su stack (masonry, masonry_core, masonry_winit, xilem_masonry,
# masonry_imaging, tree_arena) se consumen directo del `main` de linebender:
# el último release publicado (0.4.0, oct-2025) está desactualizado y los
# parches que Forja mantenía sobre él ya están upstream. Ver
# .thinkrail/context/TASK-xilem-main-migration.md.
# `Cargo.lock` congela el commit: para mover el pin, `cargo update -p xilem`.

# Perfil release: prioriza VELOCIDAD (compilador/VM).
# Nota: se retira `panic = "abort"` para preservar backtraces en
# español y permitir que los tests capturen panics (unwinding). El binario
# mínimo de distribución se obtiene con el perfil `dist` (abajo).
# Perfil de desarrollo del repo: las dependencias del stack gráfico (xilem,
# vello, wgpu, parley) sin optimizar son 10-20x más lentas y hacen que arrastrar
# un slider o el scrollbar se sienta pegajoso incluso en `cargo run --example`.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Perfil dist: prioriza TAMAÑO (binarios mínimos, sin símbolos).
# Usar con `cargo build --profile dist` (el AAR usa `dist-android`).
[profile.dist]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = "symbols"

# Perfil dist-android: mismo objetivo de tamaño que `dist`, pero con ThinLTO.
# El LTO `fat` de release multiplica el tiempo de link por cada ABI de Android
# (4 targets en CI) sin una ganancia de tamaño proporcional. Se usa solo para
# el runtime Android; el resto de la distribución sigue con `dist`.
[profile.dist-android]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = "symbols"
lto = "thin"

# perfil de benchmarks. Hereda la optimización de release pero con LTO
# más ligera y más unidades de código para que `cargo bench` (regresión de
# rendimiento en CI) compile en tiempos razonables.
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 4
