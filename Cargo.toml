[package]
name = "forja"
version = "0.9.3"
edition = "2021"
description = "Forja (fa) - Lenguaje de programación educativo en español"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
# F4-T2: no auto-descubrir benches; todos los targets se declaran explícitamente
# (15 en el submódulo `benchmarks/` + el de regresión en `benches/`).
autobenches = false

[features]
default = []
lsp = ["tower-lsp", "tokio"]
dap = []
gui = []
parallel = ["rayon"]
ir = []
h2-tls = ["rustls", "rustls-pki-types", "webpki-roots"]
all = ["lsp", "dap", "gui", "crossbeam", "h2-tls", "parallel"]

[dependencies]
# Sin dependencias externas para el núcleo - solo std de Rust
# base64, sha1, sha2: implementaciones manuales en hash.rs y base64.rs
# F3-T8: frontend y análisis semántico extraídos a crates reutilizables.
forja-syntax = { path = "crates/forja-syntax" }
forja-types = { path = "crates/forja-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossbeam = { version = "0.8", optional = true }
rayon = { version = "1", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
proptest = "1"
criterion = "0.5"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
rustyline = "14"
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[[bin]]
name = "forja-lsp"
path = "src/bin/forja_lsp.rs"
required-features = ["lsp"]

[[bin]]
name = "forja-dap"
path = "src/bin/forja_dap.rs"
required-features = ["dap"]

[[bench]]
name = "bench-fa"
path = "benchmarks/bench_fa.rs"

[[bench]]
name = "bench-vm"
path = "benchmarks/bench_vm.rs"

[[bench]]
name = "bench-compare"
path = "benchmarks/bench_forja_vs_python.rs"

[[bench]]
name = "bench-vms"
path = "benchmarks/bench_vms.rs"
harness = false

[[bench]]
name = "bench-clean"
path = "benchmarks/bench_clean.rs"

[[bench]]
name = "bench-completo"
path = "benchmarks/bench_completo.rs"

[[bench]]
name = "bench-jit"
path = "benchmarks/bench_jit.rs"
harness = false

[[bench]]
name = "bench-jit-100k"
path = "benchmarks/bench_jit_100k.rs"

[[bench]]
name = "bench-cpython-opt"
path = "benchmarks/bench_cpython_opt.rs"

[[bench]]
name = "bench-vs-python"
path = "benchmarks/bench_vs_python.rs"

[[bench]]
name = "bench-rust-native"
path = "benchmarks/bench_rust_native.rs"

[[bench]]
name = "bench-forjafast"
path = "benchmarks/bench_forjafast.rs"
harness = false

[[bench]]
name = "debug-bytecode"
path = "benchmarks/debug_bytecode.rs"

[[bench]]
name = "bench-criterion"
path = "benchmarks/bench_criterion.rs"
harness = false

# F4-T2: benchmark de regresión de rendimiento (dentro del repo padre, no del
# submódulo `benchmarks/`). Salida JSON estable comparada contra baseline.
[[bench]]
name = "perf-regresion"
path = "benches/perf_regresion.rs"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
winresource = "0.1"

[workspace]
members = [
    "crates/forja-syntax",
    "crates/forja-types",
    "crates/forja-theme",
    "crates/forja-gui-core",
    "crates/forja-gui-rt",
    "crates/forja-wasm",
    "crates/forja-wasm-gui",
    "crates/forja-rt",
    "crates/forja-android-rt",
]
exclude = [".forja_gui_cache", "fuzz"]

[patch.crates-io]
# F6-T3: commits fijados (no ramas mutables). Actualizar juntos con Cargo.lock
# cuando se migre a una versión oficial de xilem/masonry.
xilem = { git = "https://github.com/forja-lang/patches.git", rev = "21c0cca98d0333a99e3db715bce5ce874ddae4db" }
masonry_winit = { git = "https://github.com/forja-lang/patches.git", rev = "3ec102fcef87236a3544c420a7e2e21d439fa088" }
masonry = { git = "https://github.com/forja-lang/patches.git", rev = "bc7d0e803040025145bb8e911cf1c7404df85613" }

# Perfil release: prioriza VELOCIDAD (compilador/VM).
# Nota (F0-T4): se retira `panic = "abort"` para preservar backtraces en
# español y permitir que los tests capturen panics (unwinding). El binario
# mínimo de distribución se obtiene con el perfil `dist` (abajo).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

# Perfil dist: prioriza TAMAÑO (binarios mínimos, sin símbolos).
# Usar con `cargo build --profile dist` (ver scripts/build-aar.sh).
[profile.dist]
inherits = "release"
opt-level = "z"
panic = "abort"
strip = "symbols"

# F4-T2: perfil de benchmarks. Hereda la optimización de release pero con LTO
# más ligera y más unidades de código para que `cargo bench` (regresión de
# rendimiento en CI) compile en tiempos razonables.
[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 4
