[package]
build = "../../build.rs"
name = "forja"
version = "0.10.1"
edition = "2021"
description = "Forja (fa) - Lenguaje de programación educativo en español"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
# no auto-descubrir benches; todos los targets se declaran explícitamente.
autobenches = false

[features]
default = ["parallel"]
lsp = ["tower-lsp", "tokio"]
parallel = ["rayon"]
h2-tls = ["forja-vm/h2-tls", "rustls", "rustls-pki-types", "webpki-roots"]
sqlite = ["forja-vm/sqlite"]
all = ["lsp", "h2-tls", "parallel"]

[dependencies]
# Sin dependencias externas para el núcleo - solo std de Rust
# base64, sha1, sha2: implementaciones manuales en hash.rs y base64.rs
# frontend y análisis semántico extraídos a crates reutilizables.
forja-syntax = { path = "../../compiler/forja-syntax" }
forja-types = { path = "../../compiler/forja-types" }
forja-session = { path = "../../compiler/forja-session" }
forja-hir = { path = "../../compiler/forja-hir" }
forja-ir = { path = "../../compiler/forja-ir" }
forja-bytecode = { path = "../../compiler/forja-bytecode" }
forja-driver = { path = "../../compiler/forja-driver", features = ["vm"] }
forja-runtime = { path = "../../compiler/forja-runtime" }

forja-native = { path = "../../compiler/forja-native" }
forja-fmt = { path = "../../compiler/forja-fmt" }
forja-lint = { path = "../../compiler/forja-lint" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = { version = "1", optional = true }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }

[dev-dependencies]
forja-test-support = { path = "../../tests/harness" }
proptest = "1"
criterion = "0.5"

# Hora local del sistema para el historial del REPL (sin crates de zona horaria).
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["minwindef", "minwinbase", "sysinfoapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
forja-vm = { path = "../../compiler/forja-vm", features = ["sqlite", "h2-tls", "net", "process"] }
# Configuración `forja.yaml` (no aplica en wasm, que no tiene archivos).
rusqlite = { version = "0.31", features = ["bundled"] }
# Menú de configuración del REPL con flechas y Enter.
crossterm = "0.27"
rustyline = "14"
tower-lsp = { version = "0.20", optional = true }
tokio = { version = "1", features = ["full"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
forja-vm = { path = "../../compiler/forja-vm" }











# Benchmarks propios del repo: regresión (CI) y criterion (local).
[[bench]]
name = "compilar-vm"
path = "../../benches/compilar_vm.rs"
harness = false

[[bench]]
name = "perf-regresion"
path = "../../benches/perf_regresion.rs"
harness = false

[target.'cfg(not(target_arch = "wasm32"))'.build-dependencies]
winresource = "0.1"

[lib]
path = "../../src/lib.rs"
name = "forja"
doctest = false

