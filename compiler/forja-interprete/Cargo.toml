[package]
name = "forja-interprete"
version = "0.11.0"
edition = "2021"
description = "Intérprete tree-walking de Forja compartido por la GUI nativa y la web"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/forja-lang/forja"
publish = false

[features]
# `nativos` delega SQLite/archivo/JSON en forja-native (no compila en wasm32).
default = ["nativos"]
nativos = ["dep:forja-native", "dep:forja-vm", "dep:forja-runtime"]

[dependencies]
forja-syntax = { path = "../forja-syntax" }
serde_json = "1"
forja-native = { path = "../forja-native", features = ["sqlite"], optional = true }
forja-vm = { path = "../forja-vm", optional = true }
forja-runtime = { path = "../forja-runtime", optional = true }
