[package]
name = "forja-interprete"
version = "0.11.0"
edition = "2021"
description = "Intérprete tree-walking de Forja compartido por la GUI nativa y la web"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/forja-lang/forja"
publish = false

[dependencies]
forja-syntax = { path = "../forja-syntax" }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
