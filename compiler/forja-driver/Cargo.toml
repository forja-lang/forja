[package]
name = "forja-driver"
version = "0.10.1"
edition = "2021"
description = "Driver y caché de compilación de Forja"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/forja-lang/forja"
publish = false

[features]
default = []
vm = ["dep:forja-vm"]

[dependencies]
forja-bytecode = { path = "../forja-bytecode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
forja-vm = { path = "../forja-vm", optional = true }
