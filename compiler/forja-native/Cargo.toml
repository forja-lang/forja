[package]
name = "forja-native"
version = "0.10.2"
edition = "2021"
description = "Primitivas y registro nativo de Forja"
authors = ["forja-lang"]
license = "GPL-3.0-or-later"
repository = "https://github.com/forja-lang/forja"
publish = false

[features]
default = ["net", "process"]
net = []
process = []
sqlite = ["dep:rusqlite"]
h2-tls = ["dep:rustls", "dep:rustls-pki-types", "dep:webpki-roots"]

[dependencies]
forja-runtime = { path = "../forja-runtime" }
forja-bytecode = { path = "../forja-bytecode" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"], optional = true }
rustls-pki-types = { version = "1", optional = true }
webpki-roots = { version = "0.26", optional = true }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["minwindef", "minwinbase", "sysinfoapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
