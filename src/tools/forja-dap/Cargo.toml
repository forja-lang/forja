[package]
name = "forja-dap"
version = "0.10.3"
edition = "2021"
description = "Adaptador DAP de Forja"
license = "GPL-3.0-or-later"

[features]
default = []
dap = []

[[bin]]
name = "forja-dap"
path = "src/main.rs"
required-features = ["dap"]

[dependencies]
forja = { path = "../../../compiler/forja" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
