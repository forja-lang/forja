[package]
name = "forja-repl"
version = "0.10.3"
edition = "2021"
description = "REPL y modo aprender de Forja"
license = "GPL-3.0-or-later"

[dependencies]
forja = { path = "../../../compiler/forja" }
forja-driver = { path = "../../../compiler/forja-driver", features = ["vm"] }
crossterm = "0.27"
rustyline = "14"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["minwindef", "minwinbase", "sysinfoapi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
