name: Forja CI/CD

on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'src/**'
      - 'patches/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'patches/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - '.github/workflows/rust.yml'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules (excepto benchmarks)
        shell: bash
        run: |
          git submodule init
          for sub in $(git config --file .gitmodules --get-regexp path | grep -v benchmarks | sed 's/.* //'); do
            git submodule update --init --depth 1 "$sub" 2>/dev/null || echo "⚠️ Saltando $sub"
          done
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Compilación
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  build-android:
    name: Compilar Android
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules (excepto benchmarks)
        shell: bash
        run: |
          git submodule init
          for sub in $(git config --file .gitmodules --get-regexp path | grep -v benchmarks | sed 's/.* //'); do
            git submodule update --init --depth 1 "$sub" 2>/dev/null || echo "⚠️ Saltando $sub"
          done
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Install Rust targets
        run: rustup target add ${{ matrix.target }}
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false
      - name: Compilar para ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Agregar NDK al PATH para que cc-rs (libsqlite3-sys) encuentre el compilador C
          export PATH="$NDK_BIN:$PATH"
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              LINKER="$NDK_BIN/aarch64-linux-android23-clang"
              CC_TARGET="aarch64-linux-android23-clang"
              ;;
            x86_64-linux-android)
              LINKER="$NDK_BIN/x86_64-linux-android23-clang"
              CC_TARGET="x86_64-linux-android23-clang"
              ;;
            armv7-linux-androideabi)
              LINKER="$NDK_BIN/armv7a-linux-androideabi23-clang"
              CC_TARGET="armv7a-linux-androideabi23-clang"
              ;;
            i686-linux-android)
              LINKER="$NDK_BIN/i686-linux-android23-clang"
              CC_TARGET="i686-linux-android23-clang"
              ;;
          esac
          echo "Using linker: $LINKER"
          export "CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_LINKER=$LINKER"
          # cc-rs necesita CC_<TARGET> para compilar C nativo (libsqlite3-sys)
          export "CC_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')=$CC_TARGET"
          cargo build --target ${{ matrix.target }} --features gui --release --verbose
      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: forja-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/forja

  build:
    name: "Compilar (${{ matrix.os }})"
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macOS-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules (excepto benchmarks)
        shell: bash
        run: |
          git submodule init
          for sub in $(git config --file .gitmodules --get-regexp path | grep -v benchmarks | sed 's/.* //'); do
            git submodule update --init --depth 1 "$sub" 2>/dev/null || echo "⚠️ Saltando $sub"
          done
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Compilar (forja)
        run: cargo build --release --bins --features all --verbose
      - name: Compilar forja-rt
        run: cargo build -p forja-rt --release --verbose
      - name: Compilar forja-rt-gui (con GUI)
        run: |
          cargo build -p forja-rt --release --features gui --target-dir target-gui --verbose
          copy target-gui\release\forja-rt.exe target\release\forja-rt-gui.exe 2>nul || cp target-gui/release/forja-rt target/release/forja-rt-gui 2>/dev/null || true
      - name: Compilar instalador para Windows
        if: matrix.os == 'windows-latest'
        run: |
          iscc /O. installer.iss
      - name: Archivos binarios (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          mkdir staging
          copy target\release\forja.exe staging\
          copy target\release\forja-lsp.exe staging\
          copy target\release\forja-dap.exe staging\
          copy target\release\forja-rt.exe staging\
          copy target\release\forja-rt-gui.exe staging\
          xcopy /E /I stdlib staging\stdlib\
          copy forja-installer-x64.exe staging\
      - name: Archivos binarios (Linux / macOS)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir staging
          cp target/release/forja target/release/forja-lsp target/release/forja-dap staging/
          cp target/release/forja-rt target/release/forja-rt-gui staging/
          cp -r stdlib staging/stdlib
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forja-${{ matrix.os }}
          path: staging/*

  build-aar:
    name: Compilar Android AAR
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules (excepto benchmarks)
        shell: bash
        run: |
          git submodule init
          for sub in $(git config --file .gitmodules --get-regexp path | grep -v benchmarks | sed 's/.* //'); do
            git submodule update --init --depth 1 "$sub" 2>/dev/null || echo "⚠️ Saltando $sub"
          done
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: |
            aarch64-linux-android
            x86_64-linux-android
            armv7-linux-androideabi
            i686-linux-android
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false
      - name: Compilar AAR
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          bash scripts/build-aar.sh
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: forja-android-aar
          path: dist/forja-android-rt-*.aar

  build-wasm:
    name: Compilar WASM
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Checkout submodules (excepto benchmarks)
        shell: bash
        run: |
          git submodule init
          for sub in $(git config --file .gitmodules --get-regexp path | grep -v benchmarks | sed 's/.* //'); do
            git submodule update --init --depth 1 "$sub" 2>/dev/null || echo "⚠️ Saltando $sub"
          done
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        run: cargo install wasm-bindgen-cli
      - name: Install wasm-pack
        run: cargo install wasm-pack
      - name: Compilar forja-wasm
        run: cargo build --package forja-wasm --target wasm32-unknown-unknown --release
      - name: Generate WASM bindings
        run: |
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/forja_wasm.wasm \
            --out-dir wasm-output \
            --target web
      - name: Install wasm-opt (binaryen)
        run: sudo apt-get install -y binaryen
      - name: Optimize WASM with wasm-opt
        run: wasm-opt --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext -O3 wasm-output/forja_wasm_bg.wasm -o wasm-output/forja_wasm_bg.wasm
      - name: Compilar forja-wasm-gui con wasm-pack
        run: |
          mkdir -p wasm-output-gui
          WASM_OPT=false wasm-pack build crates/forja-wasm-gui --target web --out-dir ../../wasm-output-gui --out-name forja_wasm_gui --no-opt
      - name: Optimize GUI WASM with wasm-opt
        run: wasm-opt --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext -O3 wasm-output-gui/forja_wasm_gui_bg.wasm -o wasm-output-gui/forja_wasm_gui_bg.wasm
      - name: Copy GUI WASM files to output
        run: cp wasm-output-gui/* wasm-output/
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forja-wasm
          path: wasm-output/*

  release:
    name: Crear versión
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [build, build-wasm, build-aar]
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Get version
        run: echo "VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)" >> $GITHUB_ENV
      - name: Prepare binaries
        shell: bash
        run: |
          mkdir -p binaries
          # Linux
          cp artifacts/forja-ubuntu-latest/forja                  binaries/forja-linux
          cp artifacts/forja-ubuntu-latest/forja-lsp              binaries/forja-lsp-linux
          cp artifacts/forja-ubuntu-latest/forja-dap              binaries/forja-dap-linux
          cp artifacts/forja-ubuntu-latest/forja-rt               binaries/forja-rt-linux
          cp artifacts/forja-ubuntu-latest/forja-rt-gui           binaries/forja-rt-gui-linux
          # macOS
          cp artifacts/forja-macOS-latest/forja                   binaries/forja-macos
          cp artifacts/forja-macOS-latest/forja-lsp               binaries/forja-lsp-macos
          cp artifacts/forja-macOS-latest/forja-dap               binaries/forja-dap-macos
          cp artifacts/forja-macOS-latest/forja-rt                binaries/forja-rt-macos
          cp artifacts/forja-macOS-latest/forja-rt-gui            binaries/forja-rt-gui-macos
          # Windows
          cp artifacts/forja-windows-latest/forja.exe             binaries/forja.exe
          cp artifacts/forja-windows-latest/forja-lsp.exe         binaries/forja-lsp.exe
          cp artifacts/forja-windows-latest/forja-dap.exe         binaries/forja-dap.exe
          cp artifacts/forja-windows-latest/forja-rt.exe          binaries/forja-rt.exe
          cp artifacts/forja-windows-latest/forja-rt-gui.exe      binaries/forja-rt-gui.exe
          cp artifacts/forja-windows-latest/forja-installer-x64.exe binaries/forja-installer-x64.exe
          # Stdlib (desde el checkout del repo, misma para todas las plataformas)
          cp -r stdlib                                            binaries/stdlib
          # WASM
          cp artifacts/forja-wasm/forja_wasm.js                   binaries/forja_wasm.js
          cp artifacts/forja-wasm/forja_wasm_bg.wasm              binaries/forja_wasm_bg.wasm
          # WASM GUI
          cp artifacts/forja-wasm/forja_wasm_gui.js               binaries/forja_wasm_gui.js
          cp artifacts/forja-wasm/forja_wasm_gui_bg.wasm          binaries/forja_wasm_gui_bg.wasm
          # Android AAR
          cp artifacts/forja-android-aar/forja-android-rt-*.aar   binaries/
      - name: Create compressed archives
        shell: bash
        run: |
          cd binaries
          # Windows: zip con stdlib incluida
          cp forja.exe forja-lsp.exe forja-dap.exe forja-rt.exe forja-rt-gui.exe forja-installer-x64.exe forja-windows/
          cp -r stdlib forja-windows/
          zip -r ../forja-${{ env.VERSION }}-windows-x64.zip forja-windows/
          # Linux: tar.gz con stdlib incluida
          mkdir forja-linux
          cp forja-linux forja-lsp-linux forja-dap-linux forja-rt-linux forja-rt-gui-linux forja-linux/
          cp -r stdlib forja-linux/
          tar czf ../forja-${{ env.VERSION }}-linux-x64.tar.gz forja-linux/
          # macOS: tar.gz con stdlib incluida
          mkdir forja-macos
          cp forja-macos forja-lsp-macos forja-dap-macos forja-rt-macos forja-rt-gui-macos forja-macos/
          cp -r stdlib forja-macos/
          tar czf ../forja-${{ env.VERSION }}-macos-x64.tar.gz forja-macos/
          # Portable stdlib (para actualizaciones manuales)
          tar czf ../forja-${{ env.VERSION }}-stdlib.tar.gz stdlib/
          cd ..
          ls -la forja-*.zip forja-*.tar.gz
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: binaries/*
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            forja-*.zip
            forja-*.tar.gz
            binaries/forja*
            binaries/*.exe
            binaries/*.aar
