name: CD / Release

# CD: sólo entrega. Compila los artefactos de distribución y publica el
# release. La validación (fmt, clippy, tests, cobertura, docs) vive en
# `ci.yml`, `perf-regression.yml` y `crate-ci.yml`; acá sólo se corre una
# puerta mínima de build+test antes de publicar.
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'compiler/**'
      - 'library/**'
      - 'crates/**'
      - 'build.rs'
      - 'patches/**'
      - 'scripts/build-aar.sh'
      - 'scripts/toolchain-android.sh'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'installer.wxs'
      - 'installer/**'
      - '.github/workflows/cd.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'src/**'
      - 'compiler/**'
      - 'library/**'
      - 'crates/**'
      - 'build.rs'
      - 'patches/**'
      - 'scripts/build-aar.sh'
      - 'scripts/toolchain-android.sh'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'installer.wxs'
      - 'installer/**'
      - '.github/workflows/cd.yml'

env:
  CARGO_TERM_COLOR: always

# Dos pushes seguidos a main no deben firmar/publicar el mismo tag a la vez.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Self-hosted primero. GitHub no sabe caer de un runner propio a uno
  # hospedado: si el job pide `self-hosted` y no hay ninguno en línea, queda en
  # cola hasta el timeout. Por eso la elección se hace acá, en un job corto
  # sobre ubuntu-latest, que mira qué runners están online y publica el
  # `runs-on` de Linux y Windows (ver scripts/elegir-runner.py).
  elige-runner:
    name: Elegir runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      linux: ${{ steps.elegir.outputs.linux }}
      windows: ${{ steps.elegir.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - id: elegir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUNNER_LINUX: ${{ vars.RUNNER_LINUX }}
          RUNNER_WINDOWS: ${{ vars.RUNNER_WINDOWS }}
        run: python3 scripts/elegir-runner.py

  # Puerta de release: build+test mínimos antes de entregar. La matriz
  # completa (3 SO + workspace + crates) la corre `ci.yml`.
  gate:
    name: Puerta de release (build + test)
    needs: elige-runner
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # `--locked` garantiza que el Cargo.lock raíz (workspace) es la
      # fuente de verdad y que la build no resuelve dependencias nuevas.
      - name: Compilación
        run: cargo build --locked --verbose
      - name: Run tests
        run: cargo test --locked --verbose

  build-android:
    name: Compilar Android
    needs: [gate, elige-runner]
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # Una caché por target: sin esto las 4 entradas de la matriz compiten
          # por la misma clave y se invalidan entre sí.
          key: android-${{ matrix.target }}
          cache-on-failure: true
      - name: Install Rust targets
        run: rustup target add ${{ matrix.target }}
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false
      - name: Compilar para ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          # Agregar NDK al PATH para que cc-rs (libsqlite3-sys) encuentre el compilador C
          export PATH="$NDK_BIN:$PATH"
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              LINKER="$NDK_BIN/aarch64-linux-android23-clang"
              CC_TARGET="aarch64-linux-android23-clang"
              ;;
            x86_64-linux-android)
              LINKER="$NDK_BIN/x86_64-linux-android23-clang"
              CC_TARGET="x86_64-linux-android23-clang"
              ;;
            armv7-linux-androideabi)
              LINKER="$NDK_BIN/armv7a-linux-androideabi23-clang"
              CC_TARGET="armv7a-linux-androideabi23-clang"
              ;;
            i686-linux-android)
              LINKER="$NDK_BIN/i686-linux-android23-clang"
              CC_TARGET="i686-linux-android23-clang"
              ;;
          esac
          echo "Using linker: $LINKER"
          export "CARGO_TARGET_$(echo ${{ matrix.target }} | tr '[:lower:]-' '[:upper:]_')_LINKER=$LINKER"
          # cc-rs necesita CC_<target> en minúsculas con guiones bajos (los guiones
          # no son identificadores válidos de shell) para compilar C nativo
          # (libsqlite3-sys bundled). El NDK expone <triple>23-clang.
          export "CC_$(echo ${{ matrix.target }} | tr '-' '_')=$CC_TARGET"
          export "TARGET_CC=$CC_TARGET"
          cargo build --target ${{ matrix.target }} --release --verbose
      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: forja-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/forja

  # matriz de compilación multiplataforma (x86_64 y aarch64).
  # Cada entrada produce un archivo comprimido autocontenido (binarios + stdlib)
  # listo para descargar y ejecutar SIN toolchain de Rust.
  #   - Rust nativo cuando el runner coincide con la arquitectura.
  #   - macOS x64 se compila desde el runner arm64 con `--target` (SDK universal).
  # NOTA: Windows ARM64 (runner `windows-11-arm`, en preview) queda como deuda
  # para no arriesgar el release con un label de runner aún inestable.
  build:
    name: "Compilar (${{ matrix.name }})"
    needs: [gate, elige-runner]
    runs-on: ${{ fromJSON(matrix.name == 'linux-x64' && needs.elige-runner.outputs.linux || matrix.name == 'windows-x64' && needs.elige-runner.outputs.windows || format('"{0}"', matrix.os)) }}
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            unix: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            unix: true
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            unix: false
          # runner en preview; no bloquea el release hasta estabilizarse.
          - name: windows-arm64
            os: windows-11-arm
            target: aarch64-pc-windows-msvc
            unix: false
            experimental: true
          # macOS: `macos-14` es arm64 y está en retiro (brownouts desde octubre
          # de 2026 y retiro total el 2/11/2026), así que los jobs mueren antes de
          # arrancar con "The configuration 'macos-14-arm64-us-default' is not
          # supported". Van los dos labels vivos: `macos-15-intel` (Intel, el
          # reemplazo de `macos-13`) y `macos-15` (Apple Silicon).
          - name: macos-x64
            os: macos-15-intel
            target: x86_64-apple-darwin
            unix: true
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            unix: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # La pila GUI (xilem/vello) enlaza fontconfig/freetype por pkg-config:
      # ubuntu-latest los trae, los runners ARM no.
      - name: Dependencias de sistema (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y libfontconfig1-dev libfreetype-dev pkg-config
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Compilar toolchain (forja, forja-lsp, forja-dap)
        shell: bash
        run: |
          # Los tres crates no están en default-members: `--bins` a secas sólo
          # construía `forja` y el empaquetado buscaba forja-lsp/forja-dap.
          cargo build --locked --release --target ${{ matrix.target }} -p forja-cli --bin forja --features forja/all --verbose
          cargo build --locked --release --target ${{ matrix.target }} -p forja-lsp --features lsp --verbose
          cargo build --locked --release --target ${{ matrix.target }} -p forja-dap --features dap --verbose
      - name: Compilar forja-rt
        shell: bash
        run: cargo build --locked -p forja-rt --release --target ${{ matrix.target }} --verbose
      - name: Compilar forja-rt-gui (con GUI)
        shell: bash
        run: |
          cargo build --locked -p forja-rt --release --features gui \
            --target ${{ matrix.target }} --target-dir target-gui --verbose
          mkdir -p "target/${{ matrix.target }}/release"
          cp "target-gui/${{ matrix.target }}/release/forja-rt.exe" \
             "target/${{ matrix.target }}/release/forja-rt-gui.exe" 2>/dev/null || \
          cp "target-gui/${{ matrix.target }}/release/forja-rt" \
             "target/${{ matrix.target }}/release/forja-rt-gui"
      # Instalador: MSI (WiX v5, la última sin el EULA de OSMF de v6+) + bundle
      # de Burn con la UI propia (ForjaBA, WPF sobre .NET Framework 4.8).
      - name: Compilar instalador (Windows x64)
        if: matrix.name == 'windows-x64'
        shell: pwsh
        run: |
          $bin = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          foreach ($exe in 'forja','forja-lsp','forja-dap','forja-rt') {
            Copy-Item "$bin/$exe.exe" target/release/ -Force
          }
          dotnet tool install --global wix --version 5.0.2
          $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
          dotnet build installer/bootstrapper/ForjaBA.csproj -c Release
          $version = (Select-String -Path compiler/forja/Cargo.toml -Pattern '^version').Line.Split('"')[1]
          # Un solo MSI per-user (sin pedir permisos) + bundle con la UI.
          wix build -arch x64 -d Version=$version -d PathSystem=yes -d PathRoot=HKLM `
                    -o forja-installer-x64.msi installer/msi.wxs
          wix build -arch x64 -d Version=$version -o forja-setup-x64.exe installer/Bundle.wxs
          Write-Host "✅ Empaquetado forja-setup-x64.exe (UI) y forja-installer-x64.msi (silencioso)"
      - name: Empaquetar (Unix)
        if: matrix.unix
        shell: bash
        run: |
          VERSION=$(awk -F'"' '/^version = /{print $2; exit}' compiler/forja/Cargo.toml)
          PKG="forja-${VERSION}-${{ matrix.name }}"
          BIN="target/${{ matrix.target }}/release"
          mkdir -p "pack/$PKG"
          cp "$BIN/forja" "$BIN/forja-lsp" "$BIN/forja-dap" "$BIN/forja-rt" "$BIN/forja-rt-gui" "pack/$PKG/"
          cp -r library/std "pack/$PKG/stdlib"
          # Modo portable: config, manifiesto y reportes al lado del ejecutable.
          : > "pack/$PKG/forja.portable"
          for doc in README.md COMANDOS.md INSTRUCCIONES.md LICENSE.md; do
            [ -f "$doc" ] && cp "$doc" "pack/$PKG/" || true
          done
          mkdir -p dist
          tar -C pack -czf "dist/$PKG.tar.gz" "$PKG"
          echo "✅ Empaquetado dist/$PKG.tar.gz"
      - name: Empaquetar (Windows)
        if: '!matrix.unix'
        shell: pwsh
        run: |
          $version = (Select-String -Path compiler/forja/Cargo.toml -Pattern '^version').Line.Split('"')[1]
          $pkg = "forja-$version-${{ matrix.name }}"
          $bin = "target/${{ matrix.target }}/release"
          New-Item -ItemType Directory -Force -Path "pack/$pkg" | Out-Null
          Copy-Item "$bin/forja.exe","$bin/forja-lsp.exe","$bin/forja-dap.exe","$bin/forja-rt.exe","$bin/forja-rt-gui.exe" "pack/$pkg/"
          Copy-Item -Recurse library/std "pack/$pkg/stdlib"
          # Modo portable: config, manifiesto y reportes al lado del ejecutable.
          New-Item -ItemType File -Path "pack/$pkg/forja.portable" -Force | Out-Null
          if (Test-Path forja-setup-x64.exe) { Copy-Item forja-setup-x64.exe,forja-installer-x64.msi "pack/$pkg/" -ErrorAction SilentlyContinue }
          foreach ($doc in @('README.md','COMANDOS.md','INSTRUCCIONES.md','LICENSE.md')) {
            if (Test-Path $doc) { Copy-Item $doc "pack/$pkg/" }
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path "pack/$pkg" -DestinationPath "dist/$pkg.zip" -Force
          # El instalador es un asset suelto: es lo único que el usuario baja.
          if (Test-Path forja-setup-x64.exe) { Copy-Item forja-setup-x64.exe dist/ -Force }
          Write-Host "✅ Empaquetado dist/$pkg.zip y dist/forja-setup-x64.exe"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: forja-${{ matrix.name }}
          path: dist/*
          if-no-files-found: warn

  # los 4 ABIs se compilan en paralelo (un runner por target) en vez de
  # secuencialmente dentro de un solo job. El empaquetado del AAR es un job
  # aparte que solo descarga los .so ya compilados.
  build-aar-so:
    name: Android .so (${{ matrix.abi }})
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [gate, elige-runner]
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            abi: arm64-v8a
          - target: x86_64-linux-android
            abi: x86_64
          - target: armv7-linux-androideabi
            abi: armeabi-v7a
          - target: i686-linux-android
            abi: x86
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: android-aar-${{ matrix.target }}
          cache-on-failure: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false
      - name: Compilar .so para ${{ matrix.abi }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/build-aar.sh --target ${{ matrix.target }} --build-only
      - name: Upload .so
        uses: actions/upload-artifact@v4
        with:
          name: android-so-${{ matrix.abi }}
          path: dist/jni/
          if-no-files-found: error

  build-aar:
    name: Empaquetar Android AAR
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [build-aar-so, elige-runner]
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Descargar .so compilados
        uses: actions/download-artifact@v4
        with:
          pattern: android-so-*
          path: dist/jni
          merge-multiple: true
      - name: Empaquetar AAR
        run: bash scripts/build-aar.sh --package-only
      - name: Upload AAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: forja-android-aar
          path: dist/forja-android-rt-*.aar

  build-wasm:
    name: Compilar WASM
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: elige-runner
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Install wasm-bindgen
        # La versión del CLI debe coincidir con la del Cargo.lock: un desajuste
        # hace fallar la generación de bindings (schema version distinta).
        run: |
          VERSION=$(awk -F'"' '/^name = "wasm-bindgen"$/{getline; print $2; exit}' Cargo.lock)
          echo "wasm-bindgen-cli $VERSION (según Cargo.lock)"
          cargo install wasm-bindgen-cli --version "$VERSION" --locked
      - name: Compilar forja-wasm
        run: cargo build --package forja-wasm --target wasm32-unknown-unknown --release
      - name: Generate WASM bindings
        run: |
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/forja_wasm.wasm \
            --out-dir wasm-output \
            --target web
      - name: Install wasm-opt (binaryen)
        run: sudo apt-get install -y binaryen
      - name: Optimize WASM with wasm-opt
        run: wasm-opt --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue -O3 wasm-output/forja_wasm_bg.wasm -o wasm-output/forja_wasm_bg.wasm
      # El runtime GUI se genera con el MISMO camino que la VM base (cargo +
      # wasm-bindgen pinneado). wasm-pack traía su propio wasm-bindgen y emitía
      # un par glue/wasm desajustado que moría en la init del navegador
      # ("Table.grow(): failed to grow table by 4") y dejaba el playground sin GUI.
      - name: Compilar forja-wasm-gui
        run: cargo build --locked -p forja-wasm-gui --target wasm32-unknown-unknown --release
      - name: Generar bindings GUI
        run: |
          wasm-bindgen \
            target/wasm32-unknown-unknown/release/forja_wasm_gui.wasm \
            --out-dir wasm-output-gui \
            --target web \
            --out-name forja_wasm_gui
      - name: Optimize GUI WASM with wasm-opt
        run: wasm-opt --enable-bulk-memory --enable-nontrapping-float-to-int --enable-sign-ext --enable-reference-types --enable-multivalue -O3 wasm-output-gui/forja_wasm_gui_bg.wasm -o wasm-output-gui/forja_wasm_gui_bg.wasm
      - name: Copiar GUI al output y validar el par
        run: |
          cp wasm-output-gui/* wasm-output/
          node scripts/check-wasm-playground.mjs wasm-output
      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: forja-wasm
          path: wasm-output/*

  release:
    name: Crear versión
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [build, build-wasm, build-aar, elige-runner]
    permissions:
      contents: write
      attestations: write
      id-token: write
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Get version
        run: echo "VERSION=$(awk -F'"' '/^version = /{print $2; exit}' compiler/forja/Cargo.toml)" >> $GITHUB_ENV
      - name: Recolectar assets del release
        shell: bash
        run: |
          mkdir -p dist
          # 1) Paquetes precompilados por plataforma
          #    (forja-<version>-<linux-x64|linux-arm64|windows-x64|macos-x64|macos-arm64>.tar.gz|.zip)
          find artifacts -type f \( -name 'forja-*.tar.gz' -o -name 'forja-*.zip' -o -name 'forja-setup-x64.exe' \) -exec cp -v {} dist/ \;
          # 2) stdlib portable (actualizaciones manuales)
          if [ -d library/std ]; then
            mkdir -p pack-stdlib/forja-stdlib
            cp -r library/std pack-stdlib/forja-stdlib/std
            if [ -d library/gui ]; then
              cp -r library/gui pack-stdlib/forja-stdlib/gui
            fi
            tar -C pack-stdlib -czf "dist/forja-${VERSION}-stdlib.tar.gz" forja-stdlib
          fi
          # 3) WASM + GUI WASM (playground / web)
          for f in forja_wasm.js forja_wasm_bg.wasm forja_wasm_gui.js forja_wasm_gui_bg.wasm; do
            if [ -f "artifacts/forja-wasm/$f" ]; then cp -v "artifacts/forja-wasm/$f" dist/; fi
          done
          # 4) AAR de Android
          find artifacts/forja-android-aar -name '*.aar' -exec cp -v {} dist/ \; 2>/dev/null || true
          echo "── Assets del release ──"
          ls -la dist/
      # Manifiestos de Scoop y winget con la versión y el hash del release.
      - name: Manifiestos Scoop / winget
        shell: bash
        run: bash scripts/generar-manifiestos.sh "${VERSION}" dist
      # checksums SHA-256 de TODOS los assets, para verificación de descargas.
      # `sha256sum *` fallaba con "winget: Is a directory": los manifiestos de
      # generar-manifiestos.sh van en dist/winget/. Se hashean sólo archivos del
      # primer nivel, en orden estable, y sin colar el propio SHA256SUMS (que la
      # redirección crea vacío antes de que corra el comando).
      - name: Checksums (SHA-256)
        shell: bash
        run: |
          cd dist
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | LC_ALL=C sort | xargs -r sha256sum > SHA256SUMS
          echo "── SHA256SUMS ──"
          cat SHA256SUMS
      # `dist/*` incluye el directorio dist/winget/ y la acción no sabe hashear un
      # directorio. `*.*` sólo matchea archivos con extensión (los assets), así
      # que el directorio queda afuera sin tener que listar cada formato.
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.*
      # firma keyless (Sigstore/cosign) además del SHA256SUMS y la
      # atestación de procedencia. Las instalaciones pueden verificar el blob.
      - uses: sigstore/cosign-installer@v3
      - name: Firmar assets (cosign keyless)
        shell: bash
        run: |
          cd dist
          for f in *; do
            case "$f" in
              SHA256SUMS|*.bundle|*.sig|*.pem) continue ;;
            esac
            [ -f "$f" ] || continue
            cosign sign-blob --yes --bundle "$f.bundle" "$f"
            echo "✅ firmado: $f"
          done
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: |
            ## Forja v${{ env.VERSION }} — binarios precompilados

            Descargá el paquete de tu plataforma, descomprimilo y ejecutá `forja`.
            **No necesitás Rust ni compilar nada.**

            | Plataforma | Archivo |
            |------------|---------|
            | Linux x86_64 | `forja-*.tar.gz` (`linux-x64`) |
            | Linux ARM64 | `forja-*.tar.gz` (`linux-arm64`) |
            | macOS Intel | `forja-*.tar.gz` (`macos-x64`) |
            | macOS Apple Silicon | `forja-*.tar.gz` (`macos-arm64`) |
            | Windows x64 | `forja-*.zip` (`windows-x64`) |

            Cada asset incluye un `.bundle` de **cosign** (firma keyless de
            Sigstore). Para verificar:

            ```bash
            cosign verify-blob \
              --bundle forja-<version>-<plataforma>.tar.gz.bundle \
              --certificate-identity-regexp 'https://github.com/forja-lang/forja/.github/workflows/cd.yml@refs/heads/(main|master)' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              forja-<version>-<plataforma>.tar.gz
            ```

            Verificá la integridad con `SHA256SUMS`:
            ```
            sha256sum -c SHA256SUMS
            ```

            Instalación en un paso:
            - Linux/macOS: `curl -fsSL https://raw.githubusercontent.com/forja-lang/forja/main/scripts/install.sh | sh`
            - Windows (PowerShell): `irm https://raw.githubusercontent.com/forja-lang/forja/main/scripts/install.ps1 | iex`
          generate_release_notes: true
          # Mismo motivo que en la atestación: `dist/*` matchea el directorio
          # dist/winget/. Los manifiestos de winget se suben como assets planos
          # (es el nombre que pide el PR a microsoft/winget-pkgs).
          files: |
            dist/*.*
            dist/SHA256SUMS
            dist/winget/*.yaml
