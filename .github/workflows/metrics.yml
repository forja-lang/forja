name: Forja CI/CD / Métricas
on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 6 * * 1'  # Todos los lunes 6:00 UTC
  workflow_dispatch:  # Permitir ejecución manual

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # Nosotros manejamos los submodules manualmente

      - name: Checkout submodules (excepto benchmarks que tiene commit huérfano)
        shell: bash
        run: |
          git submodule init
          # Inicializar todos los submodules excepto benchmarks
          for sub in $(git config --file .gitmodules --get-regexp path | grep -v benchmarks | sed 's/.* //'); do
            echo "📦 Inicializando $sub..."
            git submodule update --init --depth 1 "$sub" 2>/dev/null || echo "⚠️  Saltando $sub"
          done

      - name: Cache Cargo
        uses: swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release

      - name: Run tests and capture output
        run: cargo test 2>&1 | tee test-output.txt

      - name: Count lines of Rust code
        run: |
          echo "RUST_LINES=$(find src crates -name '*.rs' -exec cat {} + | wc -l)" >> $GITHUB_ENV

      - name: Generate metrics.json
        run: bash scripts/metrics.sh

      - name: Deploy metrics to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./metrics-output
          destination_dir: metrics
          keep_files: true
