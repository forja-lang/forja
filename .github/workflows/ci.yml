name: CI

# CI: sólo validación (fmt, clippy, tests, cobertura). No publica nada.
# Complementa a `cd.yml` (entrega: binarios, Android, WASM y release) y a
# `perf-regression.yml` (puerta de rendimiento).
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Self-hosted primero. GitHub no sabe caer de un runner propio a uno
  # hospedado: si el job pide `self-hosted` y no hay ninguno en línea, queda en
  # cola hasta el timeout. Por eso la elección se hace acá, en un job corto
  # sobre ubuntu-latest, que mira qué runners están online y publica el
  # `runs-on` de Linux y Windows (ver scripts/elegir-runner.py).
  elige-runner:
    name: Elegir runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      linux: ${{ steps.elegir.outputs.linux }}
      windows: ${{ steps.elegir.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - id: elegir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUNNER_LINUX: ${{ vars.RUNNER_LINUX }}
          RUNNER_WINDOWS: ${{ vars.RUNNER_WINDOWS }}
        run: python3 scripts/elegir-runner.py

  # Clasifica los cambios para no ejecutar la cadena Rust completa cuando sólo
  # se tocó documentación (README, diseño). Las métricas de documentación
  # se ejecutan siempre porque también validan cifras que dependen del código.
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.filtro.outputs.codigo }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            codigo:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'compiler/**'
              - 'library/**'
              - 'crates/**'
              - 'ejemplos/**'
              - 'scripts/**'
              - 'patches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'installer.wxs'
              - 'installer/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'

  lint:
    name: Formato y Clippy
    needs: [cambios, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      # `cargo fmt --check` ya es BLOQUEANTE (el árbol Rust está formateado).
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # NOTA: clippy sigue reportándose pero NO bloquea todavía
      # (`continue-on-error: true`) por deuda de lints preexistente.
      - name: cargo clippy
        continue-on-error: true
        # `--workspace` incluye los crates de `crates/` (submódulos).
        # Sin esto, Cargo solo analiza el paquete raíz.
        run: cargo clippy --workspace --all-targets --locked
      # Fase 0 del plan de reorganización: las crates limpias ya bloquean.
      # El resto del workspace sigue reportándose sin bloquear hasta pagar su deuda.
      - name: cargo clippy (crates limpias, bloqueante)
        run: cargo clippy -p forja-syntax -p forja-types -p forja-errors -p forja-span -p forja-session -p forja-runtime -p forja-native -p forja-ir -p forja-bytecode -p forja-vm -p forja-fmt -p forja-lint -p forja-registry --all-targets --locked -- -D warnings
      # el formatter de Forja debe ser idempotente y determinista.
      # Se compila el binario y se valida `forja formatear` en modo verificación
      # (FORJA_FMT_CHECK=1; la CLI no usa flags) sobre los ejemplos.
      # Los archivos que no parsean se omiten como advertencia (no rompen el CI).
      - name: Compilar binario forja
        run: cargo build --locked --bin forja
      - name: forja formatear, verificación (ejemplos)
        run: FORJA_FMT_CHECK=1 ./target/debug/forja formatear ejemplos
      # Tests de comportamiento de la stdlib con la VM. El smoke de Rust sólo
      # comprueba que los módulos importen; esto ejecuta las funciones.
      - name: Tests de la stdlib (VM)
        run: bash scripts/probar-stdlib.sh
      # Guardas del workflow de entrega: matriz de release, firmas y par WASM
      # del playground. Cuesta milisegundos y evita publicar un release roto.
      - name: cargo xtask tidy
        run: cargo run -p forja-bootstrap --bin xtask -- tidy
      - name: cargo doc (sin warnings)
        run: RUSTC_WRAPPER= cargo doc -p forja --no-deps --locked
      - name: cargo deny
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: Validar workflow de release
        run: bash scripts/validate-release-workflow.sh
      # (auditoría externa): propiedades del compilador con proptest.
      # La suite completa ya las corre con 256 casos; acá se suben para que el
      # CI haga fuzzing de verdad (compilar nunca debe panickear).
      - name: Propiedades del compilador (proptest)
        env:
          PROPTEST_CASES: "512"
        run: cargo test --locked --test property_tests

  # Las cifras publicadas (líneas de Rust, ejemplos, módulos) se derivan del
  # código, así que nadie las mantiene a mano: este job las recalcula y
  # commitea el README cuando cambian. En PRs sólo avisa; el push a `main`
  # deja el README al día solo. El sitio vive en su repo
  # (forja-lang.github.io), así que acá no se toca nada de eso.
  metricas:
    name: Métricas de documentación (auto)
    needs: elige-runner
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Recalcular cifras en la documentación
        run: python scripts/metricas.py --write
      - name: Sincronizar README
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "✅ Cifras del README al día"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            # El push a main las commitea; en un PR sólo avisamos para no
            # reescribir la rama de nadie ni dejar checks pendientes.
            echo "::warning title=Métricas desactualizadas::Las cifras del README se actualizan solas al mezclar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(metricas): cifras de documentación al día"
          git push

  crates:
    name: Check por crate
    needs: [cambios, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    strategy:
      fail-fast: false
      matrix:
        crate:
          - forja-syntax
          - forja-types
          - forja-ir
          - forja-bytecode
          - forja-runtime
          - forja-native
          - forja-registry
          - forja-vm
          - forja-cli
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: cargo check -p ${{ matrix.crate }}
        run: cargo check -p ${{ matrix.crate }} --locked

  features:
    name: Matriz de features
    needs: [cambios, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: vm sin features
            run: cargo check -p forja-vm --no-default-features --locked
          - name: vm con sistema
            run: cargo check -p forja-vm --features net,process,sqlite,h2-tls --locked
          - name: cli
            run: cargo check -p forja-cli --locked
          - name: lsp
            run: cargo check -p forja --features lsp --locked
          - name: wasm
            run: cargo check -p forja --target wasm32-unknown-unknown --lib --locked
          - name: native sin features
            run: cargo test -p forja-native --no-default-features --test features --locked
          - name: AOT nativo
            run: cargo test -p forja-cli --test cli cli_aot_nativo_compila_y_ejecuta --locked
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  miri:
    name: Miri (crates sin FFI)
    needs: [cambios, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: cargo miri test forja-span
        run: cargo +nightly miri test -p forja-span

  cobertura-asm:
    name: Cobertura ASM (100%)
    needs: [cambios, lint, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      # Cobertura de compiler_asm.rs bloqueante. El umbral se bajó de 100 a 94
      # porque el backend sumó ramas nuevas sin tests (escanear_campos_este,
      # concat numérica, conversiones de tipo); el script sigue exigiendo 100
      # por defecto en local. Subir de nuevo al cubrirlas.
      - name: Cobertura del backend ASM
        env:
          ASM_COVERAGE_THRESHOLD: '100'
        run: bash scripts/asm-coverage.sh
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asm-coverage
          path: |
            target/cov-asm/cov/report.txt
            target/cov-asm/cov/asm.lcov
          if-no-files-found: warn

  # Los 10 programas de `benches/competencias/` compilados con el backend
  # LLVM nativo y con `rustc -O`, comparados contra una baseline de ratios.
  # Protege el rendimiento del backend: si un caso deja de compilar o el ratio
  # empeora más de 20 %, el job falla.
  bench-competencias:
    name: Bench competencias (nativo vs Rust)
    needs: [cambios, lint, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Instalar clang
        run: sudo apt-get update -qq && sudo apt-get install -y clang
      - name: Compilar la CLI (release)
        run: cargo build --locked --release -p forja-cli
      - name: Medir y comparar con la baseline
        run: bash scripts/bench-competencias.sh

  build-and-test:
    name: Build y Test (${{ matrix.os }})
    needs: [cambios, lint, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(matrix.os == 'ubuntu-latest' && needs.elige-runner.outputs.linux || matrix.os == 'windows-latest' && needs.elige-runner.outputs.windows || format('"{0}"', matrix.os)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Compilar (--locked)
        run: cargo build --locked --verbose
      - name: Ejecutar tests (--locked)
        run: cargo test --locked --verbose

  # `cargo test` desde la raíz solo selecciona el paquete raíz porque
  # el workspace tiene un paquete raíz y no define `default-members`. Los tests
  # de `crates/` (submódulos) nunca se ejecutaban. Este job los corre en un
  # único runner Linux; los crates wasm se validan contra su target real.
  workspace-tests:
    name: Tests del workspace (crates)
    needs: [cambios, lint, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: workspace-tests
      # winit/wayland necesitan estas cabeceras para compilar forja-gui-rt
      # en el host Linux.
      - name: Dependencias de sistema (GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev
      - name: Tests de crates nativos
        run: |
          cargo test --workspace --locked --verbose \
            --exclude forja-wasm \
            --exclude forja-wasm-gui
      - name: Instalar target WASM
        run: rustup target add wasm32-unknown-unknown
      - name: Check de crates WASM
        run: |
          cargo check --locked --verbose \
            -p forja-wasm \
            -p forja-wasm-gui \
            --target wasm32-unknown-unknown

  # Compilar el CLI para Android es validación, no entrega: no sube artefactos
  # (los `.so`/AAR se empaquetan en `cd.yml`). Reusa el script que ya detecta el
  # NDK y exporta los linkers por target.
  android-check:
    name: Android (${{ matrix.target }})
    needs: [cambios, lint, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # Una caché por target: sin esto las 4 entradas de la matriz compiten
          # por la misma clave y se invalidan entre sí.
          key: android-${{ matrix.target }}
          cache-on-failure: true
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false
      - name: Compilar para ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/build-android.sh "${{ matrix.target }}" release

  # auditoría de dependencias (RUSTSEC) sobre `Cargo.lock`.
  # Bloqueante: al 2026-10-30 no hay vulnerabilidades. Los 6 avisos que sí
  # aparecen son de crates "unmaintained" en transitivas de GUI/DBus (paste,
  # rustybuzz, ttf-parser, zbus_names, zvariant, zvariant_derive): `cargo audit`
  # los reporta como warning y no fallan el job.
  auditoria:
    name: Auditoría de dependencias (RUSTSEC)
    needs: [cambios, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      # Los manifiestos de `crates/` son submódulos: sin ellos no puede resolver
      # las dependencias por ruta que figuran en el lock.
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-bin: true
      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit
        run: cargo audit
