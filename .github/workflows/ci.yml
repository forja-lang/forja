name: CI

# CI: sólo validación (fmt, clippy, tests, cobertura, docs). No publica nada.
# Complementa a `cd.yml` (entrega: binarios, Android, WASM y release) y a
# `perf-regression.yml` (puerta de rendimiento).
on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Self-hosted primero. GitHub no sabe caer de un runner propio a uno
  # hospedado: si el job pide `self-hosted` y no hay ninguno en línea, queda en
  # cola hasta el timeout. Por eso la elección se hace acá, en un job corto
  # sobre ubuntu-latest, que mira qué runners están online y publica el
  # `runs-on` de Linux y Windows (ver scripts/elegir-runner.py).
  elige-runner:
    name: Elegir runner
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      linux: ${{ steps.elegir.outputs.linux }}
      windows: ${{ steps.elegir.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
      - id: elegir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUNNER_LINUX: ${{ vars.RUNNER_LINUX }}
          RUNNER_WINDOWS: ${{ vars.RUNNER_WINDOWS }}
        run: python3 scripts/elegir-runner.py

  # Clasifica los cambios para no ejecutar la cadena Rust completa cuando sólo
  # se tocó documentación (README, docs, diseño). Las métricas de documentación
  # se ejecutan siempre porque también validan cifras que dependen del código.
  cambios:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      codigo: ${{ steps.filtro.outputs.codigo }}
      docs: ${{ steps.filtro.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filtro
        with:
          filters: |
            codigo:
              - 'src/**'
              - 'tests/**'
              - 'benches/**'
              - 'crates/**'
              - 'stdlib/**'
              - 'ejemplos/**'
              - 'scripts/**'
              - 'patches/**'
              - 'build.rs'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.cargo/**'
              - 'installer.iss'
              - '.github/workflows/ci.yml'
              - '.github/workflows/cd.yml'
            docs:
              - 'docs/**'

  lint:
    name: Formato y Clippy
    needs: [cambios, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      # F2-T3: `cargo fmt --check` ya es BLOQUEANTE (el árbol Rust está formateado).
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      # NOTA (F0-T6): clippy sigue reportándose pero NO bloquea todavía
      # (`continue-on-error: true`) por deuda de lints preexistente, ajena a F2-T3.
      - name: cargo clippy
        continue-on-error: true
        # F7-T6: `--workspace` incluye los crates de `crates/` (submódulos).
        # Sin esto, Cargo solo analiza el paquete raíz.
        run: cargo clippy --workspace --all-targets --locked
      # F2-T3: el formatter de Forja debe ser idempotente y determinista.
      # Se compila el binario y se valida `forja fmt --check` sobre los ejemplos.
      # Los archivos que no parsean se omiten como advertencia (no rompen el CI).
      - name: Compilar binario forja
        run: cargo build --locked --bin forja
      - name: forja fmt --check (ejemplos)
        run: ./target/debug/forja fmt ejemplos --check
      # Guardas del workflow de entrega: matriz de release, firmas y par WASM
      # del playground. Cuesta milisegundos y evita publicar un release roto.
      - name: Validar workflow de release
        run: bash scripts/validate-release-workflow.sh

  docs:
    name: Documentación (build)
    needs: [cambios, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.docs == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Instalar dependencias
        run: npm ci --prefix docs --no-audit --no-fund
      # El par glue/wasm del playground está versionado: si se desajusta,
      # la VM no inicializa en el navegador (el sitio publicaría un playground
      # muerto). Instanciarlo acá cuesta un segundo.
      - name: Validar WASM del playground
        run: node scripts/check-wasm-playground.mjs docs/src/wasm
      - name: Build de Astro
        run: npm run build --prefix docs

  # Las cifras publicadas (líneas de Rust, ejemplos, módulos) se derivan del
  # código, así que nadie las mantiene a mano: este job las recalcula y
  # commitea el README cuando cambian. En PRs sólo avisa; el push a `main`
  # deja el README al día solo. El roadmap vive en el submódulo `docs` (no se
  # puede commitear desde acá) y se regenera al publicar el sitio, en
  # `docs-deploy.yml`.
  metricas:
    name: Métricas de documentación (auto)
    needs: elige-runner
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Recalcular cifras en la documentación
        run: python scripts/metricas.py --write
      - name: Sincronizar README
        shell: bash
        run: |
          if git diff --quiet -- README.md; then
            echo "✅ Cifras del README al día"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            # El push a main las commitea; en un PR sólo avisamos para no
            # reescribir la rama de nadie ni dejar checks pendientes.
            echo "::warning title=Métricas desactualizadas::Las cifras del README se actualizan solas al mezclar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore(metricas): cifras de documentación al día"
          git push

  cobertura-asm:
    name: Cobertura ASM (100%)
    needs: [cambios, lint, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      # F4-T6/F7-T4: cobertura de compiler_asm.rs bloqueante (umbral 100%).
      - name: Cobertura del backend ASM
        run: bash scripts/asm-coverage.sh
      - name: Publicar reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asm-coverage
          path: target/cov-asm/cov/report.txt
          if-no-files-found: warn

  build-and-test:
    name: Build y Test (${{ matrix.os }})
    needs: [cambios, lint, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(matrix.os == 'ubuntu-latest' && needs.elige-runner.outputs.linux || matrix.os == 'windows-latest' && needs.elige-runner.outputs.windows || format('"{0}"', matrix.os)) }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Compilar (--locked)
        run: cargo build --locked --verbose
      - name: Ejecutar tests (--locked)
        run: cargo test --locked --verbose

  # F7-T6: `cargo test` desde la raíz solo selecciona el paquete raíz porque
  # el workspace tiene un paquete raíz y no define `default-members`. Los tests
  # de `crates/` (submódulos) nunca se ejecutaban. Este job los corre en un
  # único runner Linux; los crates wasm se validan contra su target real.
  workspace-tests:
    name: Tests del workspace (crates)
    needs: [cambios, lint, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: workspace-tests
      # winit/wayland necesitan estas cabeceras para compilar forja-gui-rt
      # en el host Linux.
      - name: Dependencias de sistema (GUI)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev libx11-dev libfontconfig1-dev
      - name: Tests de crates nativos
        run: |
          cargo test --workspace --locked --verbose \
            --exclude forja-wasm \
            --exclude forja-wasm-gui
      - name: Instalar target WASM
        run: rustup target add wasm32-unknown-unknown
      - name: Check de crates WASM
        run: |
          cargo check --locked --verbose \
            -p forja-wasm \
            -p forja-wasm-gui \
            --target wasm32-unknown-unknown

  # Compilar el CLI para Android es validación, no entrega: no sube artefactos
  # (los `.so`/AAR se empaquetan en `cd.yml`). Reusa el script que ya detecta el
  # NDK y exporta los linkers por target.
  android-check:
    name: Android (${{ matrix.target }})
    needs: [cambios, lint, elige-runner]
    if: github.event_name == 'workflow_dispatch' || needs.cambios.outputs.codigo == 'true'
    runs-on: ${{ fromJSON(needs.elige-runner.outputs.linux) }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-linux-android
          - x86_64-linux-android
          - armv7-linux-androideabi
          - i686-linux-android
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # Una caché por target: sin esto las 4 entradas de la matriz compiten
          # por la misma clave y se invalidan entre sí.
          key: android-${{ matrix.target }}
          cache-on-failure: true
      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          add-to-path: false
      - name: Compilar para ${{ matrix.target }}
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/build-android.sh "${{ matrix.target }}" release gui
