name: CD / Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  # Las cifras del roadmap se derivan del código: aunque no toques `docs/`,
  # el sitio se republica cada semana con los números al día.
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs

jobs:
  build:
    name: Compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # El roadmap cita líneas de Rust / ejemplos / módulos del repo padre. El
      # archivo vive en el submódulo `docs`, así que no se puede commitear
      # desde acá: se regenera antes de compilar y el sitio publica cifras al día.
      - name: Regenerar métricas del roadmap
        working-directory: ${{ github.workspace }}
        run: python3 scripts/metricas.py --write

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download WASM playground from latest release
        continue-on-error: true
        run: |
          curl -sL --fail \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm_bg.wasm \
            -o src/wasm/forja_wasm_bg.wasm
          curl -sL --fail \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm.js \
            -o src/wasm/forja_wasm.js
          curl -sL --fail \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm_gui_bg.wasm \
            -o src/wasm/forja_wasm_gui_bg.wasm
          curl -sL --fail \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm_gui.js \
            -o src/wasm/forja_wasm_gui.js
      - name: Validar el WASM descargado (si no sirve, copia de git)
        shell: bash
        run: |
          # Bytes mágicos + export presente no alcanzan: el par glue/wasm puede
          # ser válido y explotar en la init del navegador (pasó con v0.9.5, el
          # playground quedó sin VM y sin GUI). Lo instanciamos de verdad.
          if ! node ../scripts/check-wasm-playground.mjs src/wasm; then
            echo "::warning title=WASM del release inválido::El par del release no inicializa; se publica la copia de git. El próximo release saldría roto."
            git checkout -- src/wasm/forja_wasm.js src/wasm/forja_wasm_bg.wasm                             src/wasm/forja_wasm_gui.js src/wasm/forja_wasm_gui_bg.wasm 2>/dev/null || true
            {
              echo "### ⚠️ WASM del release no utilizable"
              echo ""
              echo "El playground se publicó con la copia de git. Revisar el job"
              echo "`build-wasm` del release: el par glue/wasm debe salir del mismo"
              echo "wasm-bindgen que compiló el .wasm."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          node ../scripts/check-wasm-playground.mjs src/wasm || {
            echo "::error title=WASM roto::La copia de git tampoco inicializa."
            exit 1
          }

      - run: npm ci
        env:
          npm_config_audit: false
          npm_config_fund: false
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
