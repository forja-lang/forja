name: Deploy Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs

jobs:
  build:
    name: Compilación
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Download WASM playground from latest release
        continue-on-error: true
        run: |
          curl -sL --fail \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm_bg.wasm \
            -o src/wasm/forja_wasm_bg.wasm
          curl -sL --fail \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm.js \
            -o src/wasm/forja_wasm.js
          curl -sL --fail \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm_gui_bg.wasm \
            -o src/wasm/forja_wasm_gui_bg.wasm
          curl -sL --fail \
            https://github.com/forja-lang/forja/releases/latest/download/forja_wasm_gui.js \
            -o src/wasm/forja_wasm_gui.js
      - name: Verify WASM files (restore from git if download failed)
        run: |
          ANY_FAILURE=0
          # Un wasm válido empieza con los bytes mágicos \0asm (0061736d).
          for pair in "forja_wasm.js forja_wasm_bg.wasm" "forja_wasm_gui.js forja_wasm_gui_bg.wasm"; do
            set -- $pair
            js="$1"
            wasm="$2"
            magic=$(head -c 4 "src/wasm/$wasm" 2>/dev/null | od -An -tx1 | tr -d ' \n')
            if [ ! -s "src/wasm/$js" ] || [ ! -s "src/wasm/$wasm" ] || [ "$magic" != "0061736d" ] || ! grep -q "export" "src/wasm/$js"; then
              echo "⚠️  $js/$wasm inválido o descarga fallida, restaurando desde git..."
              git checkout -- "src/wasm/$js" "src/wasm/$wasm" 2>/dev/null || true
            fi
          done
          # Verify all files present
          for f in src/wasm/forja_wasm.js src/wasm/forja_wasm_bg.wasm \
                   src/wasm/forja_wasm_gui.js src/wasm/forja_wasm_gui_bg.wasm; do
            if [ ! -s "$f" ]; then
              echo "❌ Missing: $f"
              ANY_FAILURE=1
            fi
          done
          if [ "$ANY_FAILURE" -eq 1 ]; then
            echo "❌ Some WASM files are missing — build may fail"
          else
            echo "✅ All WASM files ready"
          fi

      - run: npm ci
        env:
          npm_config_audit: false
          npm_config_fund: false
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
